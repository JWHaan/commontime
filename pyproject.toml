[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "commontime"
version = "0.1.0"
description = "Find the time everyone is free — shared meeting slots from a TimeTree calendar, via CLI or MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "timetree-exporter>=0.8.0",
  "icalendar>=5.0",
  "tzdata",
  "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest"]
google = ["google-api-python-client", "google-auth-oauthlib"]

[project.scripts]
commontime = "commontime:main"
commontime-mcp = "commontime_mcp:main"

[tool.setuptools]
py-modules = ["commontime", "commontime_mcp", "providers"]
