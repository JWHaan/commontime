[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "timetree-availability-agent"
version = "0.1.0"
description = "Find shared meeting slots on a TimeTree calendar — via CLI or MCP, for humans and agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "timetree-exporter>=0.8.0",
  "icalendar>=5.0",
  "tzdata",
  "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
timetree-availability = "timetree_slots:main"
timetree-availability-mcp = "mcp_server:main"

[tool.setuptools]
py-modules = ["timetree_slots", "mcp_server"]
